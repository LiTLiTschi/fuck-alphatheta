# Rekordbox MIDI Helper - Default Configuration
#
# This file supports multiple presets - switch between different configurations easily!
#
# IMPORTANT: To use this application:
# 1. Run: fucka config
# 2. Configure your MIDI port, monitors, and shapes
# 3. Create additional presets for different use cases
# 4. Switch between presets in the config menu

general:
  # MIDI Port Configuration (Windows with loopMIDI)
  # You must install loopMIDI and create a port first:
  # Download: https://www.tobias-erichsen.de/software/loopmidi.html
  # Then configure the port name using: fucka config
  midi_port: "loopMIDI Port"

  # MIDI Input Port Configuration (where fucka listens for MIDI)
  # This is typically where Bome MIDI Translator or your hardware controller sends MIDI
  # Leave empty to be prompted on each use, or configure once in General Settings
  midi_input_port: ""

  # Screen monitoring frame rate (1-60 FPS)
  # Higher FPS = lower latency but higher CPU usage
  # Recommended: 30 for normal use, 60 for fast response
  screen_monitor_fps: 30

  # Enable debug logging to console
  debug_mode: false

  # Active preset (which configuration to use)
  # You can create multiple presets and switch between them in the config menu
  active_preset: "default"

# Presets - Multiple configurations you can switch between
# Each preset has its own screen monitors and shapes
# Useful for different scenarios (e.g., "deck_a_only", "both_decks", "effects_mode")
presets:
  # Default preset
  default:
    screen_monitors: []
    
    shapes:
      static: []
      animated: []

# Tips for configuration:
#
# Creating presets:
# - Use fucka config > Manage Presets to create/switch/copy presets
# - Each preset can have completely different monitors and shapes
# - Switch presets without restarting the application
#
# Finding screen coordinates:
# - Use the interactive configuration wizard: fucka config
# - Or use Windows Snipping Tool or a screen coordinate tool
# - Top-left corner of your monitor is (0, 0)
# - Each monitor captures exactly ONE pixel for optimal performance
#
# Finding colors:
# - Use the configuration wizard to capture colors by clicking
# - Or use a color picker tool to get RGB values
# - Set tolerance higher if the color changes slightly (like gradients or animations)
#
# MIDI mapping:
# - Use the configuration wizard to capture MIDI messages from your controller
# - Or test with MIDI-OX or similar tool first
# - Make sure channel numbers match between this config and Bome
# - Note numbers and CC controllers can be any value 0-127
#
# Performance:
# - Start with screen_monitor_fps: 30
# - Reduce if CPU usage is too high
# - Single-pixel monitoring is much faster than region monitoring
