[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekordbox-midi-helper"
version = "1.4.0"
description = "Screen monitoring and MIDI overlay tool for Rekordbox DJ software"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "LiTLiTschi"}
]
keywords = ["rekordbox", "midi", "dj", "controller", "bome", "alphatheta", "pioneer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "mido>=1.2.10",
    "PyQt5>=5.15.0",
    "mss>=9.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "colorama>=0.4.6",
    "pynput>=1.7.6",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/LiTLiTschi/fuck-alphatheta"
"Bug Reports" = "https://github.com/LiTLiTschi/fuck-alphatheta/issues"
Source = "https://github.com/LiTLiTschi/fuck-alphatheta"

[project.scripts]
fucka = "rekordbox_midi_helper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["../config/default_config.yaml"]
